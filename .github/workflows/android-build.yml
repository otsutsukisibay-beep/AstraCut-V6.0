name: AstraCut V6.0 Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract AstraCut source
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: AstraCut ZIP tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"

          rm -rf buildsrc
          mkdir -p buildsrc

          unzip -q "$ZIP" -d buildsrc

          PROJECT=$(find buildsrc -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Project Gradle tidak ditemukan."
            exit 1
          fi

          echo "Project ditemukan di: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Add JUnit dependency
        shell: bash
        run: |
          set -e
          sed -i '/^dependencies {/a\    testImplementation("junit:junit:4.13.2")' "$PROJECT/app/build.gradle.kts"
      - name: Align Java and Kotlin JVM targets
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/jvm-target.gradle" <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "21"
                  targetCompatibility = "21"
              }
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions.jvmTarget = "21"
              }
          }
          EOF

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT"
          gradle --init-script "$RUNNER_TEMP/jvm-target.gradle" :app:assembleDebug --stacktrace

      - name: Run Unit Tests
        shell: bash
        run: |
          cd "$PROJECT"
          gradle --init-script "$RUNNER_TEMP/jvm-target.gradle" :app:testDebugUnitTest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AstraCut-V6.0-debug-APK
          path: |
            ${{ env.PROJECT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AstraCut-V6.0-test-reports
          path: |
            ${{ env.PROJECT }}/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
